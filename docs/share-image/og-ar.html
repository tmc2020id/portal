<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:#fbfbfa;color:#111;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.g1{width:560px;height:560px;background:rgba(11,105,178,.35);top:-260px;left:-160px}
.g2{width:520px;height:520px;background:rgba(255,142,35,.32);bottom:-280px;right:-140px}
.g3{width:380px;height:380px;background:rgba(99,118,255,.18);top:-120px;right:120px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:0 80px}
.logo{width:330px;height:auto}
h1{font-size:58px;font-weight:700;line-height:1.25;letter-spacing:0;max-width:1040px}
h1 .accent{color:#0b69b2}
p{font-size:30px;font-weight:500;color:#5d626c;line-height:1.4;max-width:980px}
.url{margin-top:6px;display:inline-flex;align-items:center;gap:12px;font-family:Outfit,sans-serif;font-size:26px;font-weight:600;color:#0b69b2;background:#fff;border:1px solid rgba(17,17,17,.08);border-radius:999px;padding:10px 26px;box-shadow:0 6px 24px rgba(17,17,17,.06)}
.dot{width:12px;height:12px;border-radius:50%;background:#ff8e23}
.bar{position:absolute;bottom:0;left:0;right:0;height:10px;background:linear-gradient(90deg,#0b69b2 0 70%,#ff8e23 70% 100%)}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="card">
<img class="logo" src="../../public/logo-transparent.png" alt="">
<h1>معدات <span class="accent">الشبكات</span> وأنظمة <span class="accent">الحماية</span> والسيرفرات</h1>
<p>توريد للشركات والفنيين والموزعين، مع توصيل لكل سوريا</p>
<div class="url"><span class="dot"></span>tmcsmart.com</div>
</div>
<div class="bar"></div>
</body></html>
